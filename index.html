<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Project-29.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div id="calculator">
            <input id="display" readonly>
            <div class="buttons">
                <button class="button" onclick="toAdd('7')">7</button>
                <button class="button" onclick="toAdd('8')">8</button>
                <button class="button" onclick="toAdd('9')">9</button>
                <button class="button" onclick="toAdd('+')">+</button>
                <button class="button" onclick="toAdd('4')">4</button>
                <button class="button" onclick="toAdd('5')">5</button>
                <button class="button" onclick="toAdd('6')">6</button>
                <button class="button" onclick="toAdd('-')">-</button>
                <button class="button" onclick="toAdd('1')">1</button>
                <button class="button" onclick="toAdd('2')">2</button>
                <button class="button" onclick="toAdd('3')">3</button>
                <button class="button" onclick="toAdd('*')">*</button>
                <button class="button" onclick="toAdd('0')">0</button>
                <button class="button" onclick="toAdd('00')">00</button>
                <button class="button" onclick="toAdd('%')">%</button>
                <button class="button" onclick="toAdd('/')">/</button>
                <button class="button" onclick="toClear()">AC</button>
                <button class="button" onclick="toRemove()">DLT</button>
                <button class="button" onclick="toAdd('.')">.</button>
                <button class="button" onclick="toCalculate()">=</button>
            </div>
        </div>
    </div>
    <script src="Project-29.js" defer></script>
</body>
</html>
